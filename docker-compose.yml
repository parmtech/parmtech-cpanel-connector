services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3210"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-parmtech}
      PGUSER: ${POSTGRES_USER:-parmtech}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PG_SSL: "false"
    ports:
      - "127.0.0.1:3210:3210"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parmtech}
      POSTGRES_USER: ${POSTGRES_USER:-parmtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - parmtech-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parmtech} -d ${POSTGRES_DB:-parmtech}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
volumes:
  parmtech-db:
